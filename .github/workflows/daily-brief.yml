name: Daily Portfolio Brief

on:
  schedule:
    # 5 AM MYT (post US close) + every 2 hours during US market hours MYT
    # US market = 9:30 PM to 4:00 AM MYT = 13:30 to 20:00 UTC
    - cron: '0 21 * * *'      # 5 AM MYT (US close + morning summary)
    - cron: '30 13 * * 1-5'   # 9:30 PM MYT (US open)
    - cron: '30 15 * * 1-5'   # 11:30 PM MYT
    - cron: '30 17 * * 1-5'   # 1:30 AM MYT
    - cron: '30 19 * * 1-5'   # 3:30 AM MYT (US close -30min)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-brief:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate daily brief
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: node scripts/generate-brief.mjs

      - name: Commit updated brief
        run: |
          git config user.name "SIGNAL Bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add daily_brief.json
          git diff --staged --quiet && exit 0
          git commit -m "Daily brief auto-update [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done
          echo "Push failed after 3 attempts"
          exit 1
