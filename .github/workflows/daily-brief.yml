name: Daily Portfolio Brief

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-brief:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate daily brief
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: node scripts/generate-brief.mjs

      - name: Commit updated brief
        run: |
          git config user.name "SIGNAL Bot"
          git config user.email "signal-bot@users.noreply.github.com"
          git add daily_brief.json
          git diff --staged --quiet || git commit -m "Daily brief auto-update [skip ci]"
          git push
